services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:0.19.0
    container_name: crumbs
    ports:
      - "3000:3000"
    volumes:
      - crumbs-data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - DATABASE_URL=/data/crumbs.db
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    restart: unless-stopped

volumes:
  crumbs-data:
